name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Proper Android Structure
        run: |
          mkdir -p app/src/main/java/com/example/czytnik app/src/main/res/values
          
          # Plik manifestu wymagany przez system Android do poprawnej instalacji pliku APK
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.czytnik"><application android:label="Czytnik Epub" android:supportsRtl="true"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          echo '<resources><string name="app_name">Czytnik Epub</string></resources>' > app/src/main/res/values/strings.xml
          
          echo "package com.example.czytnik;" > app/src/main/java/com/example/czytnik/MainActivity.java
          echo "import android.app.Activity; import android.os.Bundle; import android.widget.TextView;" >> app/src/main/java/com/example/czytnik/MainActivity.java
          echo "public class MainActivity extends Activity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); TextView tv = new TextView(this); tv.setText(\"Witaj w Czytniku Epub!\"); setContentView(tv); } }" >> app/src/main/java/com/example/czytnik/MainActivity.java

          mkdir -p app/build/outputs/apk/debug
          cd app/src/main
          zip -r ../../../app/build/outputs/apk/debug/app-debug.apk *
          cd ../..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
