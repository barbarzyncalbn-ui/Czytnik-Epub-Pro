name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          mkdir -p app/src/main/java/com/example/czytnik
          echo "include ':app'" > settings.gradle
          echo "rootProject.name='CzytnikEpub'" >> settings.gradle
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          echo "android { namespace 'com.example.czytnik' compileSdk 34 defaultConfig { applicationId 'com.example.czytnik' minSdk 24 targetSdk 34 } }" >> app/build.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
