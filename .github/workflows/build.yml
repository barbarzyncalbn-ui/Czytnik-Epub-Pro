name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create basic Gradle structure
        run: |
          echo "include ':app'" > settings.gradle
          mkdir -p app/src/main/java/com/example/czytnik
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          echo "android { namespace 'com.example.czytnik' compileSdk 34 defaultConfig { applicationId 'com.example.czytnik' minSdk 24 targetSdk 34 versionCode 1 versionName '1.0' } }" >> app/build.gradle
          echo "ext.kotlin_version = '1.9.0'" > build.gradle

      - name: Dummy Build
        run: echo "Inicjalizacja struktury zakonczona sukcesem"
