name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Minimal Android Project
        run: |
          mkdir -p app/src/main/java/com/example/czytnik
          echo "include ':app'" > settings.gradle
          echo "rootProject.name='CzytnikEpub'" >> settings.gradle
          
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          echo "android { namespace 'com.example.czytnik' compileSdk 34 defaultConfig { applicationId 'com.example.czytnik' minSdk 24 targetSdk 34 versionCode 1 versionName '1.0' } }" >> app/build.gradle
          
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip" >> gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        run: |
          # Tworzenie uproszczonego pliku gradlew
          echo '#!/usr/bin/env sh' > gradlew
          echo 'exec java -jar gradle/wrapper/gradle-wrapper.jar "$@"' >> gradlew
          chmod +x gradlew
