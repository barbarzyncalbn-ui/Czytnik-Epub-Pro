name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Stwórz projekt Gradle
        run: |
          mkdir -p app/src/main/java/com/example/czytnik app/src/main/res/values
          
          echo "include ':app'" > settings.gradle
          echo "rootProject.name='CzytnikEpub'" >> settings.gradle
          
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          echo "android { namespace 'com.example.czytnik' compileSdk 34 defaultConfig { applicationId 'com.example.czytnik' minSdk 24 targetSdk 34 versionCode 1 versionName '1.0' } }" >> app/build.gradle
          
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          
          echo '<resources><string name="app_name">Czytnik Epub</string></resources>' > app/src/main/res/values/strings.xml
          
          echo "package com.example.czytnik;" > app/src/main/java/com/example/czytnik/MainActivity.java
          echo "import android.app.Activity; import android.os.Bundle; import android.widget.TextView;" >> app/src/main/java/com/example/czytnik/MainActivity.java
          echo "public class MainActivity extends Activity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); TextView tv = new TextView(this); tv.setText(\"Czytnik Epub - Dziala!\"); setContentView(tv); } }" >> app/src/main/java/com/example/czytnik/MainActivity.java

          # Generowanie prawnego wrapper'a i budowanie APK przez Gradle
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
